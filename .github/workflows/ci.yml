name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # Le kit s'applique a son propre corpus d'exemple : une regression de regle
  # casse la CI avant d'atteindre un corpus reel.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./cmd/memctl lint examples/corpus --format github --strict
      # Le registre d'exemple est la documentation executable du format :
      # il doit rester coherent, roles pourvus et sources sondables.
      - run: go run ./cmd/memctl perimeter examples/perimeter.yml
      # La porte s'applique a ses propres exemples : chaque verdict attendu
      # est verifie par le code de sortie (0 produire, 1 instruire, 2 rendre).
      - run: go run ./cmd/memctl gate examples/readiness/prete.yml --corpus examples/corpus --no-record
      - run: |
          go run ./cmd/memctl gate examples/readiness/a-instruire.yml --no-record && exit 1 || [ $? -eq 1 ]
      - run: |
          go run ./cmd/memctl gate examples/readiness/a-rendre.yml --no-record && exit 1 || [ $? -eq 2 ]

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
