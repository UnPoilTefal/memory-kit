name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # Le kit s'applique a son propre corpus d'exemple : une regression de regle
  # casse la CI avant d'atteindre un corpus reel.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Binaire compile plutot que « go run » : ce dernier ne propage pas le
      # code de sortie du programme, il sort en 1 quel qu'il soit — ce qui
      # rendrait invisible la verification des verdicts ci-dessous.
      - run: go build -o bin/perctl ./cmd/perctl

      # Le corpus est resolu depuis le registre : une equipe n'ecrit qu'un fichier.
      - run: ./bin/perctl lint --perimeter examples/perimeter.yml --format github --strict
      # L'usage ad hoc, sur un repertoire hors de tout perimetre declare.
      - run: ./bin/perctl lint examples/corpus --strict
      # En regime authored, « index --sync » doit refuser ET ne rien ecrire.
      # Taire index-drift sans desarmer la commande laisserait la config dire
      # une chose et l'outil rester capable du contraire.
      - name: index --sync refuse en regime authored
        run: |
          cp examples/perimeter.yml /tmp/authored.yml
          python3 - <<'PY'
          s = open('/tmp/authored.yml').read()
          s = s.replace('      index: MEMORY.md', '      index: MEMORY.md\n      index_hook: authored', 1)
          open('/tmp/authored.yml', 'w').write(s)
          PY
          avant=$(git status --porcelain examples/ | wc -l)
          if ./bin/perctl index --sync --perimeter /tmp/authored.yml; then
            echo "::error::index --sync aurait du refuser en regime authored"
            exit 1
          fi
          apres=$(git status --porcelain examples/ | wc -l)
          if [ "$avant" != "$apres" ]; then
            echo "::error::index --sync a modifie l'index alors qu'il refusait"
            exit 1
          fi
          # En derived, la commande reste operante.
          ./bin/perctl index --sync --perimeter examples/perimeter.yml > /dev/null
          git checkout -- examples/

      # Une note sans date doit bloquer par defaut, et retomber en simple
      # avertissement quand le corpus le declare. Sans le premier, le trou se
      # reforme ; sans le second, un corpus existant n'a aucune porte de sortie.
      - name: une note sans date est une erreur, sauf declaration contraire
        run: |
          mkdir -p /tmp/sansdate
          cat > /tmp/sansdate/MEMORY.md <<'MD'
          # Index

          - [Reference: sans date](reference-sans-date.md) — rien ne la rattache au temps
          MD
          cat > /tmp/sansdate/reference-sans-date.md <<'MD'
          ---
          name: reference-sans-date
          description: "Un fait parfaitement enonce, mais que rien ne permet de faire vieillir"
          metadata:
            type: reference
          ---

          Un fait.
          MD
          if ./bin/perctl lint /tmp/sansdate; then
            echo "::error::une note sans date aurait du etre une erreur"
            exit 1
          fi

      # « draft » juge un brouillon et n'ecrit jamais — ni le brouillon, ni le
      # corpus. C'est la contrainte dure du portillon : des propositions
      # relues, pas des ecritures.
      - name: draft ne modifie rien et bloque sur collision
        run: |
          avant=$(git status --porcelain examples/ | wc -l)
          cat > /tmp/brouillon.md <<'MD'
          ---
          name: reference-tout-nouveau
          description: "Un fait entierement nouveau, enonce assez precisement pour etre jugeable"
          metadata:
            type: reference
            modified: 2026-09-15
          ---

          Un fait.
          MD
          ./bin/perctl draft /tmp/brouillon.md --perimeter examples/perimeter.yml
          # Un nom deja pris doit bloquer : sinon le fichier ecrase une note.
          existante=$(ls examples/corpus/*.md | grep -v MEMORY | head -1 | xargs basename | sed 's/\.md$//')
          sed "s/reference-tout-nouveau/$existante/" /tmp/brouillon.md > /tmp/collision.md
          if ./bin/perctl draft /tmp/collision.md --perimeter examples/perimeter.yml; then
            echo "::error::draft aurait du bloquer sur une collision de nom"
            exit 1
          fi
          apres=$(git status --porcelain examples/ | wc -l)
          if [ "$avant" != "$apres" ]; then
            echo "::error::draft a modifie le corpus"
            exit 1
          fi

      # Le registre doit etre adressable autrement que par --perimeter : une
      # session d'agent ou un job de CI exporte une variable plus facilement
      # qu'il ne passe un chemin a chaque commande.
      - name: le registre se resout par PERIMETER, et un chemin absent se signale
        run: |
          cd /tmp
          if PERIMETER="$GITHUB_WORKSPACE/examples/perimeter.yml" "$GITHUB_WORKSPACE/bin/perctl" lint --strict; then
            echo "resolution par PERIMETER : ok"
          else
            echo "::error::PERIMETER n'a pas resolu le registre"
            exit 1
          fi
          if PERIMETER=/tmp/nexiste-pas.yml "$GITHUB_WORKSPACE/bin/perctl" lint 2>/dev/null; then
            echo "::error::un PERIMETER pointant un fichier absent doit etre signale, pas ignore"
            exit 1
          fi

      # « harvest » lit par execution : il doit refuser sans --allow-exec, et
      # ne jamais rien ecrire quand il s'execute. Les deux, pas l'un ou l'autre.
      - name: harvest refuse sans --allow-exec et n'ecrit rien
        run: |
          if ./bin/perctl harvest --perimeter examples/perimeter.yml; then
            echo "::error::harvest aurait du refuser sans --allow-exec"
            exit 1
          fi
          avant=$(git status --porcelain | wc -l)
          ./bin/perctl harvest --perimeter examples/perimeter.yml --allow-exec --limite 3 > /dev/null
          apres=$(git status --porcelain | wc -l)
          if [ "$avant" != "$apres" ]; then
            echo "::error::harvest a modifie l'arbre de travail"
            exit 1
          fi

      # « propose » ne doit jamais rien ecrire sans --write.
      - name: Propose sans effet de bord
        run: |
          avant=$(git status --porcelain examples/ | wc -l)
          ./bin/perctl propose --perimeter examples/perimeter.yml > /dev/null
          apres=$(git status --porcelain examples/ | wc -l)
          if [ "$avant" -ne "$apres" ]; then
            echo "::error::perctl propose a modifie des fichiers sans --write"
            exit 1
          fi
          echo "  ✓ aucun fichier modifie"

      # Le garde-fou d'execution doit refuser une PR venue d'un fork, et
      # accepter le meme corpus hors de ce contexte.
      - name: Garde-fou d'execution
        run: |
          set -euo pipefail
          cat > /tmp/ev.json <<'J'
          {"pull_request":{"head":{"repo":{"full_name":"tiers/perimeter"}}},"repository":{"full_name":"UnPoilTefal/perimeter"}}
          J
          set +e
          GITHUB_ACTIONS=true GITHUB_EVENT_NAME=pull_request GITHUB_EVENT_PATH=/tmp/ev.json \
            ./bin/perctl verify examples/corpus --allow-exec >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::perctl a execute des preuves sur une pull request de fork"
            exit 1
          fi
          echo "  ✓ refus sur une contribution externe (code $code)"

      # « --diff-probes » ne doit rien executer, et ne montrer que les preuves.
      - run: ./bin/perctl verify examples/corpus --diff-probes HEAD

      # Le gabarit d'init doit passer la validation sans retouche.
      - name: Gabarit d'init
        run: |
          tmp=$(mktemp -d)
          ./bin/perctl init --non-interactive -o "$tmp/perimeter.yml"
          ./bin/perctl perimeter "$tmp/perimeter.yml"

      # Le registre d'exemple est la documentation executable du format :
      # roles pourvus et sources sondables.
      - run: ./bin/perctl perimeter examples/perimeter.yml

      # La porte s'applique a ses propres exemples. Le verdict attendu est
      # verifie par le code de sortie : 0 produire, 1 instruire, 2 rendre.
      - name: Verdicts de la porte
        run: |
          attendu() {
            local fichier=$1 code=$2; shift 2
            set +e
            ./bin/perctl gate "$fichier" --no-record "$@" >/dev/null
            local obtenu=$?
            set -e
            if [ "$obtenu" -ne "$code" ]; then
              echo "::error file=$fichier::verdict attendu (code $code), obtenu code $obtenu"
              return 1
            fi
            echo "  ✓ $fichier — code $obtenu"
          }
          attendu examples/readiness/prete.yml       0 --corpus examples/corpus
          attendu examples/readiness/a-instruire.yml 1
          attendu examples/readiness/a-rendre.yml    2

  # Le cask est publie pour quatre plateformes. Un appel propre a macOS sans
  # garde d'OS y casse l'installation sous Linux, sans message utile.
  cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Rendre le cask et verifier ses gardes d'OS
        run: |
          go run github.com/goreleaser/goreleaser/v2@latest release \
            --snapshot --clean --skip=publish,docker >/dev/null
          python3 scripts/cask-guard.py dist/homebrew/Casks/perimeter.rb

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
