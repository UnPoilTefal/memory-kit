name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # Le kit s'applique a son propre corpus d'exemple : une regression de regle
  # casse la CI avant d'atteindre un corpus reel.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Binaire compile plutot que « go run » : ce dernier ne propage pas le
      # code de sortie du programme, il sort en 1 quel qu'il soit — ce qui
      # rendrait invisible la verification des verdicts ci-dessous.
      - run: go build -o bin/perctl ./cmd/perctl

      - run: ./bin/perctl lint examples/corpus --format github --strict

      # Le registre d'exemple est la documentation executable du format :
      # roles pourvus et sources sondables.
      - run: ./bin/perctl perimeter examples/perimeter.yml

      # La porte s'applique a ses propres exemples. Le verdict attendu est
      # verifie par le code de sortie : 0 produire, 1 instruire, 2 rendre.
      - name: Verdicts de la porte
        run: |
          attendu() {
            local fichier=$1 code=$2; shift 2
            set +e
            ./bin/perctl gate "$fichier" --no-record "$@" >/dev/null
            local obtenu=$?
            set -e
            if [ "$obtenu" -ne "$code" ]; then
              echo "::error file=$fichier::verdict attendu (code $code), obtenu code $obtenu"
              return 1
            fi
            echo "  ✓ $fichier — code $obtenu"
          }
          attendu examples/readiness/prete.yml       0 --corpus examples/corpus
          attendu examples/readiness/a-instruire.yml 1
          attendu examples/readiness/a-rendre.yml    2

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
